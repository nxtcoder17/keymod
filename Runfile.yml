tasks:
  start:
    cmd:
      - go build -o ./bin/keymod ./cmd
      - ./bin/keymod --debug
      # - ./bin/keymod

  dev:
    watch:
      enabled: true
      extensions:
        - .go
    cmd:
      - go build -o ./bin/keymod ./cmd
      - ./bin/keymod

  build:
    cmd:
      - go build -ldflags='-s -w' -o ./bin/keymod ./cmd
